name: RDP by DucThang x TrueHieu (V7 - Chốt Hạ Tuyệt Đối)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *" # Kích hoạt phiên mới mỗi 1 giờ

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true # Tự động hủy phiên cũ, giải phóng RAM khi phiên mới chạy

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Cấp quyền ghi vào repo để push file rdp_info.txt
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Đảm bảo quyền xác thực thông suốt
          persist-credentials: true         # Giữ cấu hình đăng nhập cho lệnh Git Push

      - name: Download and Extract Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "WindowsRDP2026@" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "admin" -ErrorAction SilentlyContinue)) {
              New-LocalUser "admin" -Password $pass -FullName "admin"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
              Add-LocalGroupMember -Group "Administrators" -Member "admin"
          }

      - name: Open Website in Chrome
        shell: pwsh
        run: |
          Write-Host "🚀 Đang khởi chạy Google Chrome chuẩn tham số..."
          Start-Process "chrome.exe" -ArgumentList "--kiosk","https://tinyurl.com/yn35r9z2","--no-first-run" -WindowStyle Normal -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Tối ưu Registry 4K
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Monitor Bore Stream & Force Update File
        run: |
          $PASS = "WindowsRDP2026@"
          $USER = "admin"
          $lastFullAddress = ""
          
          # Cấu hình Git bắt buộc và dọn dẹp biến cục bộ
          git config --global user.name "TrueHieu-Bot"
          git config --global user.email "bot@trueteam.top"
          git config --global core.autocrlf false
          git config --global --add safe.directory D:\a\gopi22\gopi22
          
          Write-Host "🚀 Đang truy quét Stream của Bore... Đợi Port về nhé đại ca!"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\bore\bore.exe"
          $psi.Arguments = "local 3389 --to bore.pub"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($psi)
          
          while (!$process.HasExited) {
              $line = $process.StandardOutput.ReadLine()
              if ($line) { Write-Host "[bore] $line" }
              
              # SỬA LỖI MẢNG: Bổ sung chính xác chỉ mục regex [1] và split mảng
              if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                  $fullAddress = $Matches[1]
                  $portOnly = $fullAddress.Split(':')[1]
                  if ($fullAddress -ne $lastFullAddress) {
                      $lastFullAddress = $fullAddress
                      
                      if (Test-Path "rdp_info.txt") { Remove-Item "rdp_info.txt" -Force }
                      $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
                      $reportLines = @(
                        '=======================================================',
                        'RDP INFO - DucThang x TrueHieu Edition',
                        '=======================================================',
                        "FULL ADDRESS   : $fullAddress",
                        "PORT           : $portOnly",
                        'HOST           : bore.pub',
                        '-------------------------------------------------------',
                        "Username       : $USER",
                        "Password       : $PASS",
                        "Created        : $createdAt",
                        '======================================================='
                      )
                      $report = ($reportLines -join "`r`n")
                      [System.IO.File]::WriteAllText("$(Get-Location)\rdp_info.txt", $report)
                      
                      # Ép buộc đồng bộ hóa để tránh xung đột nhánh đẩy (Push Conflict)
                      git fetch origin main
                      git stash
                      git checkout main
                      git pull origin main --rebase
                      git stash pop -ErrorAction SilentlyContinue
                      
                      git add rdp_info.txt
                      git commit -m "Update RDP: $portOnly [skip ci]" --allow-empty
                      git push origin main --force
                      
                      Write-Host "✅ ĐÃ ÉP CẬP NHẬT REPO THÀNH CÔNG: $fullAddress"
                      break
                  }
              }
              Start-Sleep -Milliseconds 200
          }
          
          # ⚙️ VÒNG LẶP VÔ HẠN AN TOÀN
          Write-Host "🔒 Chuyển sang chế độ lặp vô hạn. Phiên chạy này sẽ CHỈ DỪNG khi phiên Cron mới xuất hiện..."
          $loopCount = 0
          while ($true) {
              if ($process.HasExited) {
                  Write-Host "⚠️ Phát hiện tiến trình Bore đã bị đóng ngầm! Đang khởi động lại tiến trình..."
                  $process = [System.Diagnostics.Process]::Start($psi)
              }
              
              if ($loopCount % 10 -eq 0) {
                  Write-Host "💓 Heartbeat check - VPS vẫn đang hoạt động ổn định. Đã chạy được $loopCount phút."
              }
              
              Start-Sleep -Seconds 60
              $loopCount++
          }
